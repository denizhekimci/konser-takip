openapi: 3.1.0
info:
  title: Konser Takip API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths: {}
components:
  schemas:
    ArtistRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    EventStatus:
      type: string
      enum: [onsale, offsale, cancelled, rescheduled, postponed]
    Platform:
      type: string
      enum: [biletix, passo, bubilet, biletinial]
    VenueRef:
      type: object
      required: [id, name, city, countryCode]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2, ex. TR
    EventSummary:
      type: object
      required: [id, name, status, startsAt, localDate, localTime, timezone, venue, artists, platforms, imageUrl, priceMin, priceMax, currency]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        startsAt:
          type: string
          format: date-time
        localDate:
          type: string
          format: date
        localTime:
          type: [string, 'null']
        timezone:
          type: string
        venue:
          $ref: '#/components/schemas/VenueRef'
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistRef'
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/Platform'
        imageUrl:
          type: [string, 'null']
          format: uri
        priceMin:
          type: [number, 'null']
        priceMax:
          type: [number, 'null']
        currency:
          type: [string, 'null']
    PageMeta:
      type: object
      required: [page, size, totalElements]
      properties:
        page:
          type: integer
          minimum: 1
          description: 1'den başlar (ilk sayfa = 1)
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
    EventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EventSummary'